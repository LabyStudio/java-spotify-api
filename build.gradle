plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.2.2'
}

group 'de.labystudio'
version '1.6.0'

compileJava {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

compileTestJava {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'net.java.dev.jna', name: 'jna', version: '5.14.0'
    implementation group: 'net.java.dev.jna', name: 'jna-platform', version: '5.14.0'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.9'
}

def generatedNativeResources = layout.buildDirectory.dir('generated-resources/main')
def windowsNativeDll = providers.gradleProperty('windowsNativeDll')

sourceSets.main.resources.srcDir(generatedNativeResources)

def prepareWindowsNative = tasks.register('prepareWindowsNative', Copy) {
    onlyIf { windowsNativeDll.isPresent() }
    from(windowsNativeDll.map { file(it) })
    into(generatedNativeResources.map { it.dir('natives/windows-x64') })
    rename { 'windowsmediacontrol.dll' }
}

java {
    withSourcesJar()
    withJavadocJar()
}

processResources.dependsOn prepareWindowsNative
sourcesJar.dependsOn prepareWindowsNative

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(Test).configureEach {
    enabled = false
}

build {
    dependsOn shadowJar
}
