name: CI Build

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  native-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Build Windows native library
        run: cargo build --manifest-path rust/Cargo.toml --release --lib --locked
      - name: Upload Windows native library
        uses: actions/upload-artifact@v4
        with:
          name: windowsmediacontrol
          path: rust/target/release/windowsmediacontrol.dll
          if-no-files-found: error

  build:
    needs: native-windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Use native library built from this commit
        uses: actions/download-artifact@v4
        with:
          name: windowsmediacontrol
          path: src/main/resources/natives/windows-x64
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/*.jar
